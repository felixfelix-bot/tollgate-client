[package]
name = "tollgate-client-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "TollGate v1 client core: discovery, Cashu purchase, reliability/price/quality scoring"

[lib]
name = "tollgate_client_core"
path = "src/lib.rs"
# cdylib for the Android shell (.so loaded by the JVM); rlib for everyone else.
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "offline-policy-sim"
path = "src/bin/offline-policy-sim.rs"
required-features = ["cdk", "persistence"]

[dependencies]
url = "2.5"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
# SQLite backends need a C compiler. Persistence is explicitly opt-in;
# builds without it have no durable budget store.
rusqlite = { version = "0.31.0", features = ["bundled"], optional = true }
cdk = { version = "0.18.3", optional = true }
cdk-sqlite = { version = "0.18.3", optional = true }
# Bound Linux transport: SO_BINDTODEVICE + source bind + connect deadline.
# Already in the dependency graph (via rusqlite/tokio); `all` exposes bind_device.
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "net", "time"], optional = true }
# Only for the Android shell: the JNI shim is a marshalling layer, not logic.
jni = { version = "0.21.1", optional = true }

[features]
default = ["cdk"]
persistence = ["dep:rusqlite"]
# Deliberate legacy test harness; never enable for production.
nonproduction-test-harness = ["persistence"]
cdk = ["dep:cdk", "dep:cdk-sqlite", "dep:tokio", "dep:serde", "dep:serde_json"]
# The JNI shim the Android shell loads. Deliberately independent of `cdk`: the
# phone can buy over the Lightning lane with no wallet on the device.
android = ["dep:jni"]
