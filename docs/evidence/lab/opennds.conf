# openNDS config for the interop rig: no captive portal UI, the TollGate module
# is the only thing that authorizes clients, on br-lan (the customer bridge).
config opennds 'service'
	option enabled '1'
	option gatewayinterface 'br-lan'
	option fwhook_enabled '1'
	option login_option_enabled '0'
	option fasport '2050'
	option faspath '/'
	option fas_secure_enabled '0'
	option gatewayname 'TollGate lab'
	option preauthidletimeout '0'
	option authidletimeout '0'
	option sessiontimeout '0'
	option debuglevel '2'
	option maxclients '250'
